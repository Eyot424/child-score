name = "jinxi-stars"
compatibility_date = "2026-08-10"
pages_build_output_dir = "public"

# KV 命名空间：存那一份数据。id 要换成你自己创建的（见 DEPLOY.md 第 2 步）
[[kv_namespaces]]
binding = "STARS"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

# 家庭密码 FAMILY_PASS 不写在这里 —— 它是密钥，用命令行单独设置：
#   npx wrangler pages secret put FAMILY_PASS
